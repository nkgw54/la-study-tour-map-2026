const placeLinkCache=new Map();

function buildExactGoogleMapsUrl(place,fallbackQuery){
  const query=encodeURIComponent(fallbackQuery||place?.displayName||"");
  if(place?.id){
    return `https://www.google.com/maps/search/?api=1&query=${query}&query_place_id=${encodeURIComponent(place.id)}`;
  }
  if(place?.googleMapsURI) return place.googleMapsURI;
  return `https://www.google.com/maps/search/?api=1&query=${query}`;
}

async function resolveExactGoogleMapsPlace(query,location){
  const cacheKey=`${query}|${location?.lat||""},${location?.lng||""}`;
  if(placeLinkCache.has(cacheKey)) return placeLinkCache.get(cacheKey);

  try{
    const {Place}=await google.maps.importLibrary("places");
    const request={
      textQuery:query,
      fields:["id","displayName","formattedAddress","location","googleMapsURI"],
      locationBias:location||undefined,
      region:"US",
      maxResultCount:5
    };
    const {places}=await Place.searchByText(request);
    if(!places?.length) throw new Error("No Place result");

    let best=places[0];
    if(location){
      let bestDistance=Infinity;
      for(const p of places){
        if(!p.location) continue;
        const lat=typeof p.location.lat==="function"?p.location.lat():p.location.lat;
        const lng=typeof p.location.lng==="function"?p.location.lng():p.location.lng;
        if(!Number.isFinite(lat)||!Number.isFinite(lng)) continue;
        const d=(lat-location.lat)**2+(lng-location.lng)**2;
        if(d<bestDistance){bestDistance=d;best=p;}
      }
    }

    const result={place:best,url:buildExactGoogleMapsUrl(best,query)};
    placeLinkCache.set(cacheKey,result);
    return result;
  }catch(err){
    console.warn("Place ID resolution failed:",query,err);
    const result={place:null,url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`};
    placeLinkCache.set(cacheKey,result);
    return result;
  }
}

async function prepareExactMapLink(linkId,query,location){

function attrByKeys(attrs, keys){
  for(const key of keys){
    if(attrs && attrs[key]!==undefined && attrs[key]!==null && String(attrs[key]).trim()!==""){
      return attrs[key];
    }
  }
  if(!attrs) return "";
  const lower={};
  Object.keys(attrs).forEach(k=>lower[k.toLowerCase()]=k);
  for(const key of keys){
    const real=lower[String(key).toLowerCase()];
    if(real && attrs[real]!==undefined && attrs[real]!==null && String(attrs[real]).trim()!==""){
      return attrs[real];
    }
  }
  return "";
}

function stationNumberFromAttrs(attrs){
  let v=attrByKeys(attrs,[
    "STANUM","station","station_no","station_number","station_num","fire_station",
    "FS","FS_NO","FIRESTATION","FIRE_STATION","Station","StationNo","STATION"
  ]);
  if(v!=="" && v!==null && v!==undefined){
    const s=String(v).replace(/^0+/,"").trim();
    if(s) return s;
  }
  for(const [k,val] of Object.entries(attrs||{})){
    if(/station|stanum|fire.?station/i.test(k) && val!==null && val!==undefined){
      const m=String(val).match(/\b(\d{1,3})\b/);
      if(m) return m[1];
    }
  }
  const name=attrByKeys(attrs,["name","NAME","Name","facility","FACILITY"]);
  const m=String(name||"").match(/(?:station|sta\.?|fs)\s*#?\s*(\d{1,3})/i);
  return m?m[1]:"";
}

function formatStationAddress(attrs){
  const address=attrByKeys(attrs,["ADDRESS","address","Address","station_address","STREET_ADDRESS","FULL_ADDRESS"]);
  const city=attrByKeys(attrs,["CITY","city","City","CITYNAME_A","community","COMMUNITY"]);
  const statezip=attrByKeys(attrs,["STATEZIP","statezip","ZIP","zip","ZIPCODE","zipcode"]);
  return [address,city,statezip].filter(Boolean).map(String).join(", ");
}

function stationExtraRows(attrs, agency){
  const rows=[];
  if(agency==="LAFD"){
    const bureau=attrByKeys(attrs,["bureau","BUREAU","Bureau"]);
    const phone=attrByKeys(attrs,["telephone","TELEPHONE","phone","PHONE","business_tel","BUSINESS_TEL"]);
    if(bureau) rows.push(["管轄",String(bureau)]);
    if(phone) rows.push(["電話",String(phone)]);

}

async function fetchArcGISFeatures(url){
  const sep=url.includes("?")?"&":"?";
  const query=url+sep+"where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=2000&f=json";
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);
  try{
    const r=await fetch(query,{mode:"cors",cache:"no-store",signal:controller.signal});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data=await r.json();
    if(data.error) throw new Error(data.error.message||"ArcGIS error");
    return Array.isArray(data.features)?data.features:[];
  }finally{
    clearTimeout(timer);
  }
}

async function fetchBestArcGIS(urls,minExpected){
  let best=[];
  for(const url of urls){
    try{
      const features=await fetchArcGISFeatures(url);
      if(features.length>best.length) best=features;
      if(features.length>=minExpected) return features;
    }catch(e){
      console.warn("ArcGIS source failed:",url,e);
    }
  }
  return best;
}

function addOfficialStationMarkers(features,agency){
  const target=agency==="LAFD"?lafdMarkers:lacofdMarkers;
  const color=agency==="LAFD"?"#ff625c":"#55a6ef";
  target.forEach(m=>m.map=null);
  target.length=0;

  const seen=new Set();
  for(const f of features){
    const g=f.geometry||{};
    const lat=Number(g.y),lng=Number(g.x);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)) continue;
    const attrs=f.attributes||{};
    const num=stationNumberFromAttrs(attrs);
    const address=formatStationAddress(attrs);
    const rawName=attrByKeys(attrs,["NAME","name","Name","FACILITY","facility","CITYNAME_A"]);
    const key=num?`${agency}-${num}`:`${agency}-${lat.toFixed(5)}-${lng.toFixed(5)}`;
    if(seen.has(key)) continue;
    seen.add(key);

    const station={
      agency,number:num,address,lat,lng,
      name:rawName?String(rawName):`${agency} Fire Station`,
      extra:stationExtraRows(attrs,agency)
    };

    const marker=new google.maps.marker.AdvancedMarkerElement({
      map,
      position:{lat,lng},
      content:makeStationPin(color),
      title:num?`${agency} Fire Station ${num}`:`${agency} Fire Station`,
      zIndex:40
    });
    marker.addListener("click",()=>openStationInfo(station,marker));
    marker.__pinElement=marker.content;
    target.push(marker);
  }
  return target.length;
}

function clearDisplayedRoute(){

  routeLines=[];

function buildRoutes(){
  // 初期表示では経路線を出さない。
  // 日付をタップした時だけ、Routes APIで道路に沿った移動経路を描画する。
  clearDisplayedRoute();

function mappedPositionsForDay(day){
  const d=days.find(x=>x.day===day);
  if(!d) return [];
  const points=[];
  for(const e of d.events){
    if(!e.stop) continue;
    const s=stops[e.stop];
    if(!s) continue;
    const p={lat:s.lat,lng:s.lng,name:s.name};
    const last=points[points.length-1];
    if(!last || last.lat!==p.lat || last.lng!==p.lng) points.push(p);
  }
  return points;
}

function fitPath(path,padding=70){
  const b=new google.maps.LatLngBounds();
  (path||[]).forEach(p=>b.extend(p));
  if(!b.isEmpty()) map.fitBounds(b,padding);
}

function drawFallbackRoute(day,points){
  clearDisplayedRoute();
  if(points.length<2) return;
  const line=new google.maps.Polyline({
    map,
    path:points.map(p=>({lat:p.lat,lng:p.lng})),
    strokeColor:"#5aa7ef",
    strokeOpacity:.75,
    strokeWeight:5,
    geodesic:true,
    zIndex:500
  });
  line.day=day;
  routeLines.push(line);
  fitPath(points,70);
}

async function showDayRoute(day){
  const points=mappedPositionsForDay(day);
  clearDisplayedRoute();

  if(points.length===0){
    setStatus(`DAY ${day} はロサンゼルス周辺の地図上移動がありません。`);
    return;
  }
  if(points.length===1){
    map.panTo({lat:points[0].lat,lng:points[0].lng});
    map.setZoom(13);
    setStatus(`DAY ${day} は地図上の訪問地点が1地点です。`);
    return;
  }

  setStatus(`DAY ${day} の移動経路を計算しています…`);

  try{
    const {Route}=await google.maps.importLibrary("routes");
    const request={
      origin:{lat:points[0].lat,lng:points[0].lng},
      destination:{lat:points[points.length-1].lat,lng:points[points.length-1].lng},
      travelMode:"DRIVING",
      intermediates:points.slice(1,-1).map(p=>({location:{lat:p.lat,lng:p.lng}})),
      fields:["path","viewport","distanceMeters","durationMillis"]
    };

    const {routes}=await Route.computeRoutes(request);
    if(!routes || routes.length===0) throw new Error("No route returned");

    const route=routes[0];
    const polylines=route.createPolylines();
    polylines.forEach(poly=>{
      poly.setOptions({
        strokeColor:"#1a73e8",
        strokeOpacity:.98,
        strokeWeight:7,
        zIndex:500
      });
      poly.day=day;
      poly.setMap(map);
      routeLines.push(poly);
    });

    if(route.viewport){
      map.fitBounds(route.viewport,70);
    }else if(route.path){
      fitPath(route.path,70);
    }

    // 成功時は距離・所要時間などのステータス文を表示しない。
    setStatus("");
  }catch(err){
    console.warn("Routes API route error",err);
    drawFallbackRoute(day,points);
    setStatus(`DAY ${day} の道路ルートを取得できなかったため、地点間を簡易線で表示しています。管理者はRoutes APIの有効化を確認してください。`);
  }
}

async function enablePoiDetails(){
  map.addListener("click",async event=>{
    if(!event.placeId) return;
    if(typeof event.stop==="function") event.stop();
    try{
      setStatus("施設情報を取得しています…");
      const {Place}=await google.maps.importLibrary("places");
      const place=new Place({id:event.placeId,requestedLanguage:"ja",requestedRegion:"US"});
      await place.fetchFields({fields:[
        "displayName","formattedAddress","googleMapsURI","websiteURI","nationalPhoneNumber",
        "rating","userRatingCount","regularOpeningHours","businessStatus","primaryTypeDisplayName"
      ]});
      showPoiInfo(place,event.latLng);
      setStatus("施設情報を表示しました。");
    }catch(err){
      console.warn("Place details error",err);
      const fallback=`https://www.google.com/maps/search/?api=1&query_place_id=${encodeURIComponent(event.placeId)}`;
      infoWindow.setContent(`<div class="info"><h3>Google Maps施設</h3>
        <p class="subtle">詳細取得には Places API (New) の有効化が必要です。</p>
        <div class="actions"><a class="chiplink" target="_blank" href="${fallback}">Google Mapsで見る ↗</a></div></div>`);
      infoWindow.setPosition(event.latLng);infoWindow.open(map);
      setStatus("Places APIの詳細取得に失敗しました。Google Mapsリンクは利用できます。");
    }
  });
}

function showPoiInfo(place,position){
  const rating=(place.rating!=null)?`<p class="rating">★ ${place.rating.toFixed(1)}${place.userRatingCount?`（${place.userRatingCount.toLocaleString()}件）`:""}</p>`:"";
  const phone=place.nationalPhoneNumber?`<p>☎ ${esc(place.nationalPhoneNumber)}</p>`:"";
  const type=place.primaryTypeDisplayName?`<p class="subtle">${esc(place.primaryTypeDisplayName)}</p>`:"";
  const hours=(place.regularOpeningHours?.weekdayDescriptions||[]).slice(0,7);
  const hoursHtml=hours.length?`<div class="hours"><b>営業時間</b><br>${hours.map(esc).join("<br>")}</div>`:"";
  const mapsUrl=place.googleMapsURI||`https://www.google.com/maps/search/?api=1&query_place_id=${encodeURIComponent(place.id)}`;
  const web=place.websiteURI?`<a class="chiplink" target="_blank" href="${esc(place.websiteURI)}">公式サイト ↗</a>`:"";
  infoWindow.setContent(`<div class="info">
    <h3>${esc(place.displayName||"施設")}</h3>
    ${type}
    ${place.formattedAddress?`<p>${esc(place.formattedAddress)}</p>`:""}
    ${rating}${phone}${hoursHtml}
    <div class="actions">
      <a class="chiplink" target="_blank" href="${esc(mapsUrl)}">Google Maps ↗</a>${web}
    </div>
  </div>`);
  infoWindow.setPosition(position);infoWindow.open(map);
}


function selectedStopKeysForDay(day){
  const d=days.find(x=>x.day===day);
  if(!d) return new Set();
  return new Set(d.events.filter(e=>e.stop).map(e=>e.stop));
}

function setPinFocused(el,focused){
  if(!el?.classList) return;
  el.classList.toggle("marker-focus",focused);
  el.classList.toggle("marker-dim",!focused);
}

function applyDayEmphasis(){
  if(selectedDay===null){
    visitMarkers.forEach(x=>x.element?.classList.remove("marker-dim","marker-focus"));
    touristMarkers.forEach(x=>x.element?.classList.remove("marker-dim","marker-focus"));
    lafdMarkers.forEach(m=>m.__pinElement?.classList.remove("marker-dim","marker-focus"));
    lacofdMarkers.forEach(m=>m.__pinElement?.classList.remove("marker-dim","marker-focus"));
    map?.setOptions({clickableIcons:true});
    return;
  }

  const activeKeys=selectedStopKeysForDay(selectedDay);

  // その日に訪問する施設だけ通常色。その他のカスタムピンはほぼ透明にする。
  visitMarkers.forEach(x=>setPinFocused(x.element,activeKeys.has(x.key)));
  touristMarkers.forEach(x=>setPinFocused(x.element,false));
  lafdMarkers.forEach(m=>setPinFocused(m.__pinElement,false));
  lacofdMarkers.forEach(m=>setPinFocused(m.__pinElement,false));

  // 日別ルート表示時は標準POIのクリックを止め、当日の確認に集中しやすくする。
  map?.setOptions({clickableIcons:false});
}

function updateVisibility(){
  const on=$("layerVisits").checked;
  visitMarkers.forEach(x=>x.marker.map=on?map:null);
  const tourismOn=$("layerTourism").checked;
  touristMarkers.forEach(x=>x.marker.map=tourismOn?map:null);
  const lafdOn=$("layerLafd").checked;
  lafdMarkers.forEach(m=>m.map=lafdOn?map:null);
  const lacofdOn=$("layerLacofd").checked;
  lacofdMarkers.forEach(m=>m.map=lacofdOn?map:null);
  routeLines.forEach(l=>l.setMap(on&&selectedDay!==null&&selectedDay===l.day?map:null));
  applyDayEmphasis();
}

function focusStop(key,eventIndex){
  if(!map)return;
  selectedDay=null;clearDisplayedRoute();updateVisibility();
  const x=visitMarkers.find(x=>x.key===key);if(!x)return;
  document.querySelectorAll(".event").forEach(el=>el.classList.toggle("active",+el.dataset.event===eventIndex));
  map.panTo({lat:x.stop.lat,lng:x.stop.lng});map.setZoom(13);openStopInfo(key,x.marker);
  if(innerWidth<=900) closeSheet();
}

async function focusDay(day){
  if(!map)return;

  const sameDay=selectedDay===day;
  selectedDay=sameDay?null:day;

  document.querySelectorAll(".day-head").forEach((el,i)=>{
    const d=days[i];
    el.classList.toggle("active",selectedDay!==null && d?.day===selectedDay);
  });

  if(selectedDay===null){
    clearDisplayedRoute();
    updateVisibility();
    fitPractice();
    return;
  }

  updateVisibility();
  await showDayRoute(day);

  if(innerWidth<=900) closeSheet();
}

function fitPractice(){
  if(!map)return;
  selectedDay=null;clearDisplayedRoute();document.querySelectorAll('.day-head').forEach(el=>el.classList.remove('active'));updateVisibility();
  const b=new google.maps.LatLngBounds();
  uniqueMappedStops().forEach(key=>{const s=stops[key];b.extend({lat:s.lat,lng:s.lng})});
  map.fitBounds(b,70);$("practiceBtn").classList.add("active");$("wideBtn").classList.remove("active");
}
function fitWide(){
  if(!map)return;
  selectedDay=null;clearDisplayedRoute();document.querySelectorAll('.day-head').forEach(el=>el.classList.remove('active'));updateVisibility();
  const b=new google.maps.LatLngBounds();
  [{lat:33.52,lng:-118.72},{lat:34.42,lng:-117.42}].forEach(p=>b.extend(p));
  map.fitBounds(b,45);$("wideBtn").classList.add("active");$("practiceBtn").classList.remove("active");
}

function toggleSheet(){
  const open=$("sidebar").classList.toggle("sheet-open");
  $("sheetChevron").textContent=open?"⌄":"⌃";
}
function closeSheet(){
  $("sidebar").classList.remove("sheet-open");$("sheetChevron").textContent="⌃";
}

function locateMe(){
  if(!navigator.geolocation){setStatus("このブラウザは現在地取得に対応していません。");return}
  setStatus("現在地を取得しています…");
  navigator.geolocation.getCurrentPosition(pos=>{
    const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(userMarker)userMarker.map=null;
    const dot=document.createElement("div");dot.style.cssText="width:18px;height:18px;border-radius:50%;background:#1a73e8;border:4px solid white;box-shadow:0 1px 7px rgba(0,0,0,.4)";
    userMarker=new google.maps.marker.AdvancedMarkerElement({map,position:p,content:dot,title:"現在地"});
    map.panTo(p);map.setZoom(14);setStatus("現在地を表示しました。");
  },err=>setStatus("現在地を取得できませんでした: "+err.message),{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
}

$("layerVisits").onchange=updateVisibility;$("layerTourism").onchange=updateVisibility;$("layerLafd").onchange=updateVisibility;$("layerLacofd").onchange=updateVisibility;$("practiceBtn").onclick=fitPractice;$("wideBtn").onclick=fitWide;$("fitAll").onclick=fitWide;
$("sheetHead").onclick=toggleSheet;$("locateBtn").onclick=locateMe;
$("shareBtn").onclick=async()=>{
  const data={title:"ロサンゼルス海外実習マップ 2026",text:"国士舘大学 ロサンゼルス海外実習マップ 2026",url:location.href};
  try{
    if(navigator.share){await navigator.share(data);}
    else{await navigator.clipboard.writeText(location.href);setStatus("公開URLをコピーしました。");}
  }catch(e){if(e?.name!=="AbortError")setStatus("共有できませんでした。URLをコピーして共有してください。");}
};
window.addEventListener("resize",()=>{if(innerWidth>900)$("sidebar").classList.remove("sheet-open")});

renderItinerary();

function bootApp(){
  if(location.protocol==="file:"){
    document.body.innerHTML = `
      <div style="min-height:100vh;background:#0b1420;color:#f4f7fb;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
        <div style="max-width:680px;background:#12202d;border:1px solid #3d5265;border-radius:14px;padding:26px;box-shadow:0 20px 80px rgba(0,0,0,.45)">
          <h2 style="margin-top:0">公開版URLから開いてください</h2>
          <p style="line-height:1.7;color:#c2d0dd">学生共有版はHTTPS公開URLから利用します。</p>
          <p><a href="https://nkgw54.github.io/la-study-tour-map-2026/" style="color:#8bc7ff;font-weight:800;word-break:break-all">https://nkgw54.github.io/la-study-tour-map-2026/</a></p>
        </div>
      </div>`;
    return;
  }
  loadGoogleMaps(getConfiguredApiKey());
}
bootApp();
</script>
